[project]
name = "file-downloader-analyzer"
version = "1.0.0"
description = "Service for downloading and analyzing text files from an external API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "sqlalchemy>=2.0.45",
    "asyncpg>=0.31.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "celery>=5.6.2",
    "redis>=7.3.0",
    "aiohttp>=3.13.3",
    "python-dotenv>=1.2.1",
    "colorlog>=6.10.1",
    "jinja2>=3.1.0",
    "aiofiles>=25.1.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3"
httpx = "^0.28"
ruff = "^0.15"
mypy = "^1.19"
pre-commit = "^3.7"
aiosqlite = "^0.22"
faker = "^40.36.0"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = "."
markers = [
    "integration: integration tests",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning"
]
